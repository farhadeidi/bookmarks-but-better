[workspace]
resolver = "3"
members = ["crates/bbb-vault-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/farhadeidi/bookmarks-but-better"
authors = ["Bookmarks But Better contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The crate is a domain library whose module names intentionally mirror the
# vault concepts they model, so `naming::NameAllocator` style paths are wanted.
module_name_repetitions = "allow"

[profile.release]
strip = "debuginfo"
