[workspace]
resolver = "3"
members = ["crates/bookmarks-but-better", "crates/bookmarks-but-better-vault-core"]

[workspace.package]
# The Rust crates carry the product version, the same one `package.json` and
# all extension manifests carry, so a release tag names one number rather than
# one per language. `GET /api/v1/health` and `bookmarks-but-better --version` report it straight
# from `CARGO_PKG_VERSION`.
version = "4.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/farhadeidi/bookmarks-but-better"
authors = ["Bookmarks But Better contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# The crate is a domain library whose module names intentionally mirror the
# vault concepts they model, so `naming::NameAllocator` style paths are wanted.
module_name_repetitions = "allow"

[profile.release]
strip = "debuginfo"
