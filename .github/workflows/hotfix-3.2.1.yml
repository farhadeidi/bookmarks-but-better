name: Release 3.2.1 Hotfix

on:
  push:
    tags:
      - "v3.2.1"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build, verify, and create release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json

      - name: Validate release versions
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "v3.2.1"
          test "$(jq -r '.version' package.json)" = "3.2.1"
          test "$(jq -r '.version' manifests/manifest.chrome.json)" = "3.2.1"
          test "$(jq -r '.version' manifests/manifest.firefox.json)" = "3.2.1"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gates
        run: |
          bun run typecheck
          bun run test
          bun run lint

      - name: Build extensions
        run: |
          bun run build:chrome
          bun run build:firefox
          test "$(jq -r '.version' dist-chrome/manifest.json)" = "3.2.1"
          test "$(jq -r '.version' dist-firefox/manifest.json)" = "3.2.1"
          test -f dist-chrome/theme-bootstrap.js
          test -f dist-firefox/theme-bootstrap.js

      - name: Package extensions
        run: |
          set -euo pipefail
          mkdir artifacts
          (cd dist-chrome && zip -r -q ../artifacts/bookmarks-but-better-chrome-v3.2.1.zip .)
          (cd dist-firefox && zip -r -q ../artifacts/bookmarks-but-better-firefox-v3.2.1.zip .)
          cd artifacts
          sha256sum *.zip > SHA256SUMS

      - name: Upload release packages for store publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: extension-packages-3.2.1
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v3.2.1
          name: v3.2.1 — Dark Mode Hotfix
          body: |
            ## Fixed

            - Eliminated the brief white flash before dark mode is applied on a new tab.
            - Applied the saved light, dark, or system preference before the React app loads.

            This is a focused hotfix based on v3.2.0.
          files: |
            artifacts/bookmarks-but-better-chrome-v3.2.1.zip
            artifacts/bookmarks-but-better-firefox-v3.2.1.zip
            artifacts/SHA256SUMS
          prerelease: false
          make_latest: true

  publish-stores:
    name: Publish extensions to stores
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: production-stores
      url: https://github.com/${{ github.repository }}/releases/tag/v3.2.1
    steps:
      - name: Verify protected store configuration
        env:
          CANARY: ${{ secrets.PRODUCTION_STORES_CONFIGURED }}
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          set -euo pipefail
          test -n "${CANARY}"
          test -n "${CHROME_EXTENSION_ID}"
          test -n "${CHROME_CLIENT_ID}"
          test -n "${CHROME_CLIENT_SECRET}"
          test -n "${CHROME_REFRESH_TOKEN}"
          test -n "${AMO_JWT_ISSUER}"
          test -n "${AMO_JWT_SECRET}"

      - name: Download extension packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: extension-packages-3.2.1
          path: artifacts

      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@fdfe79400af990f5145a319e834aee64907ccff4 # v6.0.0
        with:
          file-path: artifacts/bookmarks-but-better-chrome-v3.2.1.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true

      - name: Submit to Firefox Add-ons
        uses: kewisch/action-web-ext@84a13bb9e1b6108c43788ba091c41ca1dba6ad45 # v2.0
        with:
          cmd: sign
          source: artifacts/bookmarks-but-better-firefox-v3.2.1.zip
          channel: listed
          apiKey: ${{ secrets.AMO_JWT_ISSUER }}
          apiSecret: ${{ secrets.AMO_JWT_SECRET }}
          approvalTimeout: 0
