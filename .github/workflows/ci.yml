name: CI

# Runs the frontend quality gates (formatting, lint, types, tests, extension
# builds) and the Rust gates (format, clippy, tests, build, docs) on every push
# and pull request so regressions are caught before they reach main or a
# release. The two jobs are independent and run in parallel.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Reads the pinned version from package.json's "packageManager"
          # field, so there is one place to bump it.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gates
        run: bun run check

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust
        # rustup installs whatever rust-toolchain.toml pins, components and
        # all, so the version lives in exactly one file rather than being
        # repeated here where it could drift.
        run: rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Build
        run: cargo build --workspace --all-features

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features
