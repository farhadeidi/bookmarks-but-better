name: CI

# Runs the frontend quality gates (formatting, lint, types, tests, extension
# builds) on every push and pull request so regressions are caught before
# they reach main or a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gates
        run: bun run check
