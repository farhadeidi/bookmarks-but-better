name: CI

# Runs the frontend quality gates (formatting, lint, types, tests, extension
# builds) on every push and pull request so regressions are caught before
# they reach main or a release.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Reads the pinned version from package.json's "packageManager"
          # field, so there is one place to bump it.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Quality gates
        run: bun run check
