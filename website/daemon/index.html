<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vault daemon — Bookmarks But Better</title>
    <meta
      name="description"
      content="Serve your bookmarks from a folder of Markdown files with a small local daemon. Checksum-verified install, localhost-only, multiple vaults — and the way to use the dashboard in Safari."
    />
    <link rel="canonical" href="https://bookmarks.farhadeidi.com/daemon/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#faf9f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1b1a17"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bookmarks But Better" />
    <meta property="og:title" content="Vault daemon — Bookmarks But Better" />
    <meta
      property="og:description"
      content="Your bookmarks as plain Markdown files, served from localhost. Optional everywhere, required on Safari."
    />
    <meta property="og:url" content="https://bookmarks.farhadeidi.com/daemon/" />
    <meta
      property="og:image"
      content="https://bookmarks.farhadeidi.com/og.png"
    />
    <meta
      property="og:image:alt"
      content="Bookmarks But Better dashboard in dark mode"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vault daemon — Bookmarks But Better" />
    <meta
      name="twitter:description"
      content="Your bookmarks as plain Markdown files, served from localhost."
    />
    <meta
      name="twitter:image"
      content="https://bookmarks.farhadeidi.com/og.png"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem("bbb-site-theme")
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark")
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-background text-foreground font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/entries/daemon.tsx"></script>
  </body>
</html>
