<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live preview — Bookmarks But Better</title>
    <meta
      name="description"
      content="Try the real Bookmarks But Better extension in your browser — a live new tab dashboard with a simulated bookmark library. Drag, edit, switch themes and sources; nothing leaves your machine."
    />
    <meta name="robots" content="noindex" />
    <link rel="canonical" href="https://bookmarks.farhadeidi.com/preview" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#faf9f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1b1a17"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bookmarks But Better" />
    <meta property="og:title" content="Live preview — Bookmarks But Better" />
    <meta
      property="og:description"
      content="Try the real extension in your browser — live, private, seeded with demo bookmarks."
    />
    <meta
      property="og:url"
      content="https://bookmarks.farhadeidi.com/preview"
    />
    <meta
      property="og:image"
      content="https://bookmarks.farhadeidi.com/og.png"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem("bbb-site-theme")
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark")
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/entries/preview.tsx"></script>
  </body>
</html>
