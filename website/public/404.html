<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — Bookmarks But Better</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: #faf9f5;
        color: #332f29;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 2rem;
        box-sizing: border-box;
        text-align: center;
      }
      main {
        max-width: 32rem;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: clamp(2.5rem, 8vw, 4.5rem);
        line-height: 1;
        margin: 0;
      }
      p {
        color: #70695f;
        line-height: 1.6;
      }
      a {
        color: #9b5b12;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          color-scheme: dark;
          background: #1b1a17;
          color: #f0eee8;
        }
        p {
          color: #aaa49a;
        }
        a {
          color: #e5a34c;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p>Bookmarks But Better</p>
      <h1>Nothing here.</h1>
      <p>The page you were looking for has wandered off the shelf.</p>
      <a href="/">Return to the dashboard</a>
    </main>
  </body>
</html>
