<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy — Bookmarks But Better</title>
    <meta
      name="description"
      content="No accounts, no analytics, no tracking, no bookmark-content collection. Where your bookmarks live and the only network requests the extension makes — in plain language."
    />
    <link rel="canonical" href="https://bookmarks.farhadeidi.com/privacy/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#faf9f5"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#1b1a17"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bookmarks But Better" />
    <meta property="og:title" content="Privacy — Bookmarks But Better" />
    <meta
      property="og:description"
      content="No accounts, no analytics, no tracking, no bookmark-content collection."
    />
    <meta
      property="og:url"
      content="https://bookmarks.farhadeidi.com/privacy/"
    />
    <meta
      property="og:image"
      content="https://bookmarks.farhadeidi.com/og.png"
    />
    <meta
      property="og:image:alt"
      content="Bookmarks But Better dashboard in dark mode"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Privacy — Bookmarks But Better" />
    <meta
      name="twitter:description"
      content="No accounts, no analytics, no tracking, no bookmark-content collection."
    />
    <meta
      name="twitter:image"
      content="https://bookmarks.farhadeidi.com/og.png"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem("bbb-site-theme")
          if (
            t === "dark" ||
            (!t && matchMedia("(prefers-color-scheme: dark)").matches)
          ) {
            document.documentElement.classList.add("dark")
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body class="bg-background text-foreground font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/entries/privacy.tsx"></script>
  </body>
</html>
