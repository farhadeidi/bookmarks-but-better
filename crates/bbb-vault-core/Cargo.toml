[package]
name = "bbb-vault-core"
description = "Canonical Markdown vault format for Bookmarks But Better: parsing, validation, deterministic scanning and byte-preserving updates."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["bookmarks", "markdown", "frontmatter", "vault"]
categories = ["parser-implementations", "filesystem"]

# Every dependency here replaces something that must not be hand-rolled:
# cryptography, operating-system randomness, the Unicode character database,
# YAML conformance, and race-free filesystem traversal. Nothing is taken for
# convenience alone.
[dependencies]
# Capability-oriented filesystem handles. `std` cannot open a path without a
# check-then-use window; these give `openat`-style handles with O_NOFOLLOW
# (and the Windows reparse-point equivalent) so a path can never be swapped
# between the check and the read.
cap-std = "4.0.2"
cap-fs-ext = "4.0.2"
# Unicode full case folding (ß folds to ss), which `str::to_lowercase` does not
# do. Needed for correct collision detection on case-insensitive filesystems.
caseless = "0.2.2"
# Operating-system randomness for identity generation.
getrandom = "0.4.3"
# An independent, conformant YAML parser used to *validate* front matter that
# the byte-range scanner deliberately does not interpret. It never writes: all
# mutations still go through the byte-range path.
saphyr-parser = "0.0.11"
# The child-order state file is JSON, and a JSON reader is no more hand-rollable
# than a YAML one: it has to reject duplicate object keys rather than silently
# keep the last, which is exactly what a `Value`-shaped parse would do. The
# derived `Serialize` also fixes the canonical rendering in one place.
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# SHA-256 for content revisions.
sha2 = "0.11.0"
# Unicode normalization (NFC for names written to disk, NFD for caseless
# matching).
unicode-normalization = "0.1.25"

[dev-dependencies]

[lints]
workspace = true
